<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOCK IN</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/img/logo.ico"
    />
  </head>
  <body>
    <!-- Barra lateral -->
    <div class="app-layout">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menu">
        <i class="bi bi-list"></i>
      </button>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
          <h1>LOCK IN</h1>
        </div>

        <nav class="sidebar-nav">
          <a href="perfil.html" class="nav-item active"> Perfil </a>
          <a href="index.html" class="nav-item"> Estudio </a>
          <a href="#" class="nav-item"> Salir </a>
        </nav>
      </aside>

      <!-- Contenido principal -->
      <main class="content">
        <header>
          <h2 id="saludo">Buen dia</h2>
          <p id="fecha-actual"></p>
        </header>
        <div class="cards-grid">
          <!-- POMODORO -->
          <section id="pomodoro" class="card card-time">
            <h2 id="tiempo">00:25:00</h2>
            <div class="btn-group-pomodoro">
              <button id="iniciar">Iniciar</button>
              <button id="pausar">Pausar</button>
              <button id="reiniciar">Reiniciar</button>
            </div>
            <div id="cards-sets">
              <label>Modo de estudio:</label>
              <select id="tipoPomodoro">
                <option value="25-5">25 min estudio / 5 min descanso</option>
                <option value="50-10">50 min estudio / 10 min descanso</option>
                <option value="90-20">90 min estudio / 20 min descanso</option>
              </select>

              <label>Cantidad de sets:</label>
              <select id="cantidadSets">
                <option value="1">1 set</option>
                <option value="2">2 sets</option>
                <option value="3">3 sets</option>
                <option value="4">4 sets</option>
              </select>
            </div>
            <h4 id="estadoPomodoro">Estudio</h4>
          </section>

          <!-- LISTA DE TAREAS -->
          <section id="tareas" class="card card-tasks">
            <h3>Lista de Tareas</h3>
            <div class="task-input-row">
              <input
                type="text"
                id="task-input"
                placeholder="Escribí una nueva tarea"
              />
              <button onclick="addTask()">Agregar tarea</button>
            </div>

            <button class="btn-clear" onclick="clearCompleted()">
              Borrar finalizadas
            </button>

            <p id="counter"></p>

            <div id="task-list"></div>
          </section>

          <!-- PROGRESO -->
          <section id="progreso" class="card card-progress">
            <h3>Progreso</h3>

            <div class="progress-item">
              <span>Tiempo acumulado</span>
              <strong id="cronometro">00:00</strong>
            </div>

            <div class="progress-item">
              <span>Objetivo de estudio</span>
              <strong
                ><span id="minutosActuales">0</span>/<span id="objetivoMinutos"
                  >60</span
                >
                min</strong
              >
            </div>

            <progress id="barraProgreso" value="0" max="100"></progress>
            <p id="porcentaje">0%</p>

            <div class="progress-item">
              <span>Tareas finalizadas</span>
              <strong id="contadorTareas">0</strong>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Libreria para el confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
