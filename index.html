<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOCK IN</title>
  </head>
  <body>
    <section id="seccionProgreso">
      <h2>Progreso</h2>
      <div>
        <h3>Tiempo acumulado</h3>
        <p id="cronometro">00:00</p>
      </div>

      <div>
        <h3>Objetivo de estudio</h3>
        <p>
          <span id="minutosActuales">0</span>/
          <span id="objetivoMinutos">60</span>minutos
        </p>
      </div>

      <div>
        <h3>Barra de progreso</h3>
        <progress id="barraProgreso" value="0" max="100"></progress>
        <p id="porcentaje">0%</p>
      </div>

      <div>
        <h3>Tareas Finalizadas</h3>
        <p id="contadorTareas">0</p>
      </div>
    </section>
  </body>
</html>
